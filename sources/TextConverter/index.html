<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="logo">⇄</div><div><h1 data-zh="文本转换粘贴" data-en="Clipboard Converter"></h1><p data-zh="粘贴一次，自由转换格式。" data-en="Paste once. Convert into the format you need."></p></div><span class="badge" data-zh="本机离线转换" data-en="Local & offline"></span></header>
<main><section><div class="bar"><h2 data-zh="输入" data-en="Input"></h2><select id="source"><option value="auto">自动识别 / Auto</option><option value="markdown">Markdown</option><option value="html">HTML</option><option value="slack">Slack</option><option value="plain">纯文本 / Plain text</option></select></div><div class="tools"><button id="paste" class="primary" data-zh="从剪贴板粘贴" data-en="Paste clipboard"></button><button id="clear" data-zh="清空" data-en="Clear"></button><span id="detected"></span></div><textarea id="input" spellcheck="false" aria-label="Input"></textarea><footer id="inputCount"></footer></section>
<div class="arrow">→</div><section><div class="bar"><h2 data-zh="输出" data-en="Output"></h2><select id="target"><option value="html">富文本 / Rich Text</option><option value="markdown">Markdown</option><option value="slack">Slack</option><option value="plain">纯文本 / Plain text</option></select></div><div class="tools"><button id="copy" class="primary" data-zh="复制转换结果" data-en="Copy result"></button><button id="toggle" data-zh="查看源码" data-en="View source"></button></div><div id="preview"></div><textarea id="output" readonly aria-label="Output"></textarea><footer id="outputCount"></footer></section></main>
<div class="bottom"><span data-zh="富文本可粘贴到 Word、邮件等应用；其他格式复制后按 ⌘V 粘贴。" data-en="Paste rich text into Word or email. Copy any format and press ⌘V in your destination."></span><span id="status" role="status"></span></div><script src="marked.js"></script><script src="turndown.js"></script><script src="turndown-gfm.js"></script><script src="converter.js"></script></body></html>
